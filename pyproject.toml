[project]
name = "choislet"
version = "0.2.0"
description = "A desktop application designed to help users make random decisions through interactive tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet[all]>=1.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
